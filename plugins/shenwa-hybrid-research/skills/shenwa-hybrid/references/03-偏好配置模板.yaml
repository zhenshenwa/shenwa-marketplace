# ==============================================================
# 03 · 客户偏好配置模板
# --------------------------------------------------------------
# 这是客户【唯一需要修改】的文件。改完保存即生效。
# 不要修改 01/02/04/05/06 等主干逻辑文件——那是模式维护者的职责。
#
# 用法：复制本文件为 profile.yaml，按注释填写。
# 带 ← 必填 标记的字段请务必确认；其余留默认值即可运行。
#
# 配套：
#   03A-偏好选项库.md    —— 每个偏好项的 3~4 个选项及含义
#   03B-偏好选择表单.md  —— 勾选式一页表单，客户圆选即可
#   presets/             —— 4 套开箱预设（价值稳健/成长挖掘/趋势交易/量化因子）
#
# 若不想逐项配置，直接复制 presets/ 下任一预设覆盖本文件即可。
# ==============================================================

# ==============================================================
# 偏好二分（v1.9.0）—— 同一套事实适配不同任务与表达需要
# --------------------------------------------------------------
# 本文件里的偏好分两类，用途不同；**两类都不得改写事实**：
#   ① 表达偏好（EXPRESSION_PREFS）：语言 / 长度 / 图表 / 结构 / 关注重点
#      —— 只影响"怎么说"。改它**不改变**事实、关键数字、证据状态、结论判定。
#   ② 任务约束（TASK_CONSTRAINTS）：研究期限 / 比较目标 / 风险限制 / 明确指定的方法
#      —— 只影响"研究什么范围"，不改变事实本身。
# 风格、风险容忍度与结论语气只改变**呈现顺序与措辞**，
# **不改变客观判断，也不提高/降低任何情景的概率或权重**。
# ==============================================================

meta:
  client_name: "示例客户"          # 客户名称，用于报告落款
  profile_version: "1.0.0"          # 偏好版本号，每次修改请递增
  last_updated: "2026-09-25"        # 最近修改日期

# ==============================================================
# 一、主维度：投资风格与策略  ★客户个性化核心
# ==============================================================
identity:
  # 主风格 ← 必填
  # 可选：value(价值) | growth(成长) | trend(趋势) | short_term(短线) | quant(量化) | thematic(主题)
  primary_style: value

  # 次口径（可选，作为补充视角，留空则不启用）
  secondary_style: growth

  # 时间视角 ← 必填　[任务约束：研究期限]
  # 可选：long(3-5年) | medium(1-3年) | short(周-季)
  horizon: medium

  # 风险容忍度 ← 必填　[表达偏好]
  # 可选：conservative(保守) | balanced(中性) | aggressive(进取)
  # 只改风险段的**呈现**（篇幅 / 强调 / 是否加额外提示）；
  # **不改变**客观判断，也**不提高/降低**任何情景的概率或权重。
  risk_tolerance: balanced

  # 结论表述倾向 ← 必填　[表达偏好]
  # 可选：conservative(偏审慎) | neutral(中性) | aggressive(偏积极)
  # 只改结论摘要的**呈现顺序与措辞**（先说方向还是先说反面证据）；
  # 事实、关键数字、证据状态、结论判定一律不变。
  conclusion_bias: neutral


# ==============================================================
# 二、偏好派生表（只读参考，无需修改）
# --------------------------------------------------------------
# 路由层会根据 primary_style 自动派生下列口径，客户可用
# overrides 段覆盖其中任意一项。
# ==============================================================
# ┌──────────────┬────────────────────────┬──────────────┬──────────────────────────────────────────┐
# │ 风格         │ 默认估值方法            │ 默认时间视角  │ 核心关注指标                              │
# ├──────────────┼────────────────────────┼──────────────┼──────────────────────────────────────────┤
# │ value        │ DCF / PB-ROE / 股息率   │ 长期         │ 自由现金流、ROE、负债率、分红率            │
# │ growth       │ PEG / PS / 远期PE       │ 中期         │ 营收增速、毛利率趋势、研发投入、渗透率      │
# │ trend        │ 相对强弱 / 量价         │ 短期         │ 趋势动量、成交额、资金流向、板块强度        │
# │ short_term   │ 事件驱动 / 情绪面       │ 短期         │ 龙虎榜、换手率、题材热度、公告催化          │
# │ quant        │ 因子暴露 / 多因子       │ 中短期       │ 因子IC、估值分位、波动率、流动性            │
# │ thematic     │ 空间测算 / 可比公司     │ 中长期       │ 渗透率、TAM、产业链卡位、订单能见度         │
# └──────────────┴────────────────────────┴──────────────┴──────────────────────────────────────────┘


# ==============================================================
# 三、数据权重偏好（**阅读 / 关注权重**，非已校准的量化模型）
# 决定"先看哪一类、取数时勾选哪些"，合计 1.0。
# ⚠️ 它只影响**关注角度与版式详略**，不改变结论口径、数字与证据状态，
#    也不产生任何加权评分 —— **不冒充已校准的量化模型**。
# ==============================================================
data_weights:
  fundamental: 0.35      # 基本面（财务、经营）
  valuation: 0.25        # 估值
  capital_flow: 0.15     # 资金面
  sentiment_news: 0.15   # 舆情与研报
  technical: 0.10        # 技术面

overrides:
  valuation_method: ""   # 留空则按派生表；可填 "DCF" / "PEG" / "PB-ROE" 等
  focus_metrics: []      # 追加关注指标，如 ["经营现金流/净利润", "应收账款周转"]


# ==============================================================
# 四、深挖（Shenwa）配置
# ==============================================================
shenwa:
  # 深挖使用强度 ← 决定深挖内容在交付物中的比重
  # 可选：light(轻量 约30%) | baseline(基准 约50%) | intensive(加强 约60%)
  # 若实际比重与所选档位不同，**只在任务卡说明理由**；
  # **不做自动回退**（旧版"否则按 baseline 执行"已作废）。
  intensity: baseline

  # 报告深度档位，影响模板挑选（brief=摘要式 / standard=标准 / dd=尽调级）
  report_depth: standard

  # 模板偏好：留空则由路由层自动匹配；也可指定模板名做优先
  template_preference: []

  # 深挖原文完整**归档** —— 固定 true，不建议修改（v1.9.0 措辞校准）
  # 「完整归档」= 归档件保留全文（含已确认错误的段落）；
  # **正文是否附全文由交付形态决定**：摘要式正文可不附，另给归档入口。
  return_full_text: true

  # PDF 下载时机：always(每次自动) | on_request(询问后) | never
  download_pdf: on_request

  # 报告归档方式：private(私有保存) | public(公开保存) | discard(不归档)
  archive_mode: private

  # 发布前检查深挖点余额与账户有效期
  precheck_balance: true


# ==============================================================
# 五、数据源配置
# ==============================================================
datasource:
  # 市场范围，可多选：A | HK | US
  market_scope: [A]

  # 关注池填充模式：core_holding(核心持仓型) | sector_watch(行业观察型) | theme_tracking(主题跟踪型)
  watchlist_mode: core_holding

  # 关注池（用于每日复盘、异动跟踪）；留空则不自动跟踪
  # 填写格式：代码 名称 | 分组 | 备注
  watchlist: []

  # 数字偏差容忍阈值：≤此值判定为「一致」
  cross_check_tolerance: 0.01

  # 是否强制每个数字标注来源与截取时点 —— 建议保持 true
  require_source_annotation: true

  # 数据源优先级（按能力类别覆盖默认顺序，留空用默认）
  source_priority: {}


# ==============================================================
# 六、输出配置
# ==============================================================
output:
  language: zh                  # zh | en | bilingual
  depth: standard               # brief(摘要式) | standard(标准) | dd(尽调级)
  # 交付形态：由**任务深度与问题类型**决定，**不按内容篇幅**（v1.9.0）
  #   auto(按任务自动) | short_answer(短答) | comparison_table(比较表)
  #   | brief(简析) | full_report(完整报告)
  #   —— **只有完整报告**采用六段结构；其余形态只呈现必要内容，
  #      但**关键问题的回答必须完整、重要结论必须有依据、证据不足必须可见**。
  form: auto
  format: markdown              # markdown | table | pdf | xlsx
  # ⚠️ 输出格式转换**不得改变**结论、数字与验证状态（v1.9.0）。
  # ⚠️ format=pdf 时须区分两类来源（v1.9.0）：
  #    ① 深挖官方原文 PDF → 标注为「**原始报告**」；
  #    ② 专家包**综合**版 PDF → 当前环境**不支持**，须说明并交付 markdown / table / xlsx。
  include_visual: key            # none(不附) | key(关键图表) | full(全量图表)
  include_validation_table: full # full(完整) | mandatory_only(仅强制项) | none(不附，需书面确认)
  max_length: 0                 # 0 = 不限制（深挖原文完整返回时不裁剪）


# ==============================================================
# 七、修正日志
# --------------------------------------------------------------
# 记录偏好如何随使用演进。可由客户手动填写，也可由智能体
# 在检测到重复反馈模式后建议追加（applied_by: auto）。
# ==============================================================
corrections: []
# - date: "2026-09-25"
#   trigger: "客户连续三次追加询问经营现金流质量"
#   change: "data_weights.fundamental 0.35→0.40, valuation 0.25→0.20"
#   applied_by: manual
#
# - date: "2026-09-26"
#   trigger: "客户反馈结论表述过于乐观"
#   change: "conclusion_bias: neutral→conservative"
#   applied_by: auto


# ==============================================================
# 八、最小可运行配置（供快速开始参考）
# --------------------------------------------------------------
# 若只想立刻跑起来，至少填写以下 5 项：
#   identity.primary_style    投资风格
#   identity.horizon          时间视角
#   identity.risk_tolerance   风险容忍度
#   identity.conclusion_bias  结论表述倾向
#   output.depth              输出深度
# 其余字段保持默认即可。
#
# 更省事的两种方式：
#   ① 取预设：复制 presets/预设-价值稳健.yaml（或成长挖掘/趋势交易/量化因子）
#             的内容整体覆盖本文件，改掉 client_name 即可运行。
#   ② 填表单：在 03B-偏好选择表单.md 上圈选后交由工程侧写入配置。
#
# 全库共 18 个偏好项、57 个选项，逐项含义见 03A-偏好选项库.md。
# ==============================================================
